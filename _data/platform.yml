# Language-neutral facts about the site. Text for every item is in _data/i18n/<lang>.yml.

contact_email: "info@terradatalab.ch"                    # used by every e-mail link (mailto)
booking_url: "https://calendar.app.google/bSMCYqQJFt6VAV4Y6"  # booking page: Hero main button + green band button
linkedin_url: "http://www.linkedin.com/in/matteojriva"        # footer LinkedIn link (personal profile for now)
sister_url: "https://urbandatalab.ch"                         # sister company, linked by the UrbanDataLab banner (under the header and above the footer, home page only)

# Site-wide images: files in assets/images/, generated from the master image001.png (which stays untouched).
favicon: "favicon-32.png"                  # browser-tab icon, 32×32
favicon_large: "favicon-192.png"           # larger icon, 192×192 (Android)
apple_touch_icon: "apple-touch-icon.png"   # iPhone/iPad home-screen icon, 180×180
share_image: "share.jpg"                   # share image 1200×630 for link previews

# Hero › image on the right: web copy of image001.png (file in assets/images/, empty = no image)
# Used only as the fallback when the two animated layers below are empty. NOT published at the moment
# (listed under exclude in _config.yml): remove it from that list before using the fallback.
hero_image: "hero-tree.png"
# Hero › animated photo ↔ mesh tree (MEMORY.md §8.2): two full trees made by mirroring each half of image001.png,
# same size and framing. The split line slides left/right. Both set = animation; either empty = hero_image above.
hero_image_photo: "hero-tree-photo.webp"
hero_image_mesh: "hero-tree-mesh.webp"

# How we work › platform block. Core Data Viewer video in the centre of the platform hub (file in assets/images/)
viewer_video: "Screencast002.webm"
# Poster = still image shown before/instead of the video: light copy of screencastPoster.png (file in assets/images/)
viewer_poster: "screencast-poster.webp"
viewer_video_speed: 2                       # playback speed of the video (1 = normal, 2 = twice as fast)
# Modules around the viewer, in display order: first 3 on the left, last 3 on the right.
# ids = keys of how_we_work.platform.modules in the text files.
modules: [satellite, public_db, metrics, operations, dynamic_monitoring, weather_scenarios]

# Solutions › table. Columns in display order (ids = keys of solutions.columns in the text files).
solution_columns: [core, satellite, public_db, metrics, operations]
# Rows, in display order (ids = keys of solutions.items in the text files).
# "includes" = columns marked as part of the combination.
combinations:
  - id: see_field
    includes: [core]
  - id: baseline
    includes: [core, satellite, public_db]
  - id: land_evolution
    includes: [core, satellite, metrics]
  - id: operations
    includes: [core, satellite, operations]
  - id: audit
    includes: [core, metrics, operations]

# Who we are › people cards, in display order (ids = keys of about.people in the text files).
# photo: file name in assets/images/ (empty = placeholder); photos are round crops of matteo001.png / Patrick_Schirmer.jpg (masters untouched; patrick.webp 336 px since 2026-11-11). A card with an empty name is not shown.
# linkedin_url: this person's LinkedIn profile (empty = no link on the card).
people:
  - id: matteo
    photo: "matteo.webp"
    linkedin_url: "http://www.linkedin.com/in/matteojriva"
  - id: patrick
    photo: "patrick.webp"
    linkedin_url: "https://www.linkedin.com/in/patrick-m-schirmer/"
