# TerraDataLab: ALL WEBSITE TEXT, English
#
# How to edit:
#   - Change only the text between the quotes. Do not rename the keys (the words before ":").
#   - Every language file (en.yml, de.yml, fr.yml, it.yml) has exactly the same keys.
#   - For a long text spanning several lines use:   text: |
#                                                     First line…
#     Leave an empty line between paragraphs.
#   - A list item starts with "- " on its own line.
#   - Section order follows the page from top to bottom.
#   - An empty text ("") is simply not shown on the page.

meta:
  title: "TerraDataLab - data solutions for sustainability"   # browser tab / search result title (empty: "TerraDataLab")
  description: "We build the data pipelines, tools and dashboards that show, with evidence, how your project makes the world a better place."   # search result snippet + share-preview text (same text as hero.subtitle)

nav:
  how_we_work: "How we work"         # header link to the How we work section
  solutions: "Solutions"             # header link to the Solutions section
  about: "Who we are"                # header link to the Who we are section
  cta: "Let's talk"                  # header button (e-mail)
  language: ""              # screen-reader label for the language switcher
  skip: ""                  # "Skip to content" link for keyboard users

udl_banner:                 # blue UrbanDataLab banner, home page only: under the header and again above the footer (empty = hidden)
  text: "Looking for other use cases?"   # text of the banner
  link: "Visit UrbanDataLab"             # link to urbandatalab.ch (sister_url in _data/platform.yml); the arrow is added by the design
  tagline: "Your Data Expert for Smarter Location Decisions."   # shown after the link, desktop only (empty = hidden)

hero:                       # first block of the page
  eyebrow: ""               # small line above the headline (not used for now)
  title: "Trust your carbon and nature projects. We build the tools to prove it."   # headline
  subtitle: "We build the data pipelines, tools and dashboards that show, with evidence, how your project makes the world a better place."   # text below the headline
  offer: ""                 # short highlighted line ("the offer")
  cta_primary: "Book a 30-minute call"      # main button: opens the booking page (new tab)
  cta_secondary: "See how we work"          # second button: jumps to How we work
  image_alt: ""             # description of the hero image for screen readers (empty = decorative)

how_we_work:                # "How we work" section (header link "How we work")
                            # display order: title → intro → platform hub → button (cta) → steps (each: title, text, detail paragraph below)
  eyebrow: ""               # small line above the headline (not used for now)
  title: "Built with you. Built for your project."   # main headline at the top of the section
  platform:                 # block "viewer at the centre + modules around it"
    title: ""               # centred headline of the block (not used for now; empty = hidden)
    intro: "A customisable data viewer brings all your project data into one place. Plug in the modules your project needs, when it needs them."   # text below the block headline
    video_alt: "Shows the Core Data Viewer displaying data related to an agricarbon project in Switzerland."   # description of the Core Data Viewer video for screen readers
    core:                   # caption under the video
      name: "Core Data Viewer"
      text: "One place to view and control your project data, for the whole team."
    modules:                # items around the video; ids must match _data/platform.yml (modules)
      satellite:
        name: "Satellite Hook"
        text: "Enrich your data with satellite images and time series."
      public_db:
        name: "Public Databases"
        text: "Fewer samples, stronger baseline."
      metrics:
        name: "Metric Calculator"
        text: "Compliant metrics to measure your progress."
      operations:
        name: "Operations Hook"
        text: "Keep track of measurements and interventions in your fields."
      dynamic_monitoring:
        name: "Dynamic Monitoring Tool"
        text: "Compare your project area with reference sites, dynamically."
      weather_scenarios:
        name: "Weather Scenario Builder"
        text: "Weather scenarios from your local climate history."
  steps:                    # numbered steps, 01–03 automatically; detail = paragraph below each step
    - title: "Workshop"
      text: "Define requirements together."
      detail: |
        We start with a workshop. Map what you actually need, not what a template says you should need. The infrastructure is yours to choose. Want it in the cloud? On your servers? Hybrid? You decide
    - title: "Setup"
      text: "See your data overview immediately."
      detail: |
        As soon as we have the area of interest, your project data is there for you. And you're never locked in: raw data exports whenever you want. core components are open source. APIs so you can plug it into whatever else your team uses.
    - title: "Development prioritised with you"
      text: "Your priorities set the order. We build, review and refine together"
      detail: |
        Open source components and customized modules based on your needs allow you to enrich, integrate and validate all project information. And you pay only what you use.
  cta: "Let's talk about what your project actually needs."   # button below the steps (e-mail)

solutions:                  # "Solutions" section: cards, one per combination, each listing its modules by the names under "columns" (no table)
  eyebrow: ""               # small line above the headline (not used for now)
  title: "One platform. Five combinations for carbon and nature projects."   # headline
  intro: "For sustainability projects, from baseline through audit."   # text below the headline
  modules_label: "Modules"  # green label before the module names on each card
  columns:                  # module names listed on each card; ids must match _data/platform.yml (solution_columns)
    core: "Core Data Viewer"
    satellite: "Satellite Hook"
    public_db: "Public Databases"
    metrics: "Metric Calculator"
    operations: "Operations Hook"
  items:                    # one card per combination (name + short text); ids must match _data/platform.yml (combinations)
    see_field:
      name: "See your field"
      text: "All your project data in one view, shared by the whole team."
    baseline:
      name: "Get baseline"
      text: "Satellite and soil data show the current state of the land, and compares it dynamically with reference areas"
    land_evolution:
      name: "Land evolution"
      text: "Track changes in the land using satellite time series and measurements, and relate them to your actions"
    operations:
      name: "Operations"
      text: "Field work, observations and measurments in one place, traceable as it happens."
    audit:
      name: "Reporting"
      text: "Every number linked to its source and every observation to its place, ready for your validation or certification."

cta:                        # green band near the bottom
  title: "Ready to talk about your project?"   # text in the band
  button: "Get in touch"    # button: opens the booking page (new tab)

about:                      # "Who we are" section, after the green band
  title: "Understand first. Build second."   # headline
  intro: "Climate change is already here: our land, our roads and our food systems need active care to keep sustaining us. We believe there is no single solution, but many, each adapted to a place, a time and a community. So we connect the people a project needs (land managers, carbon developers and data specialists) and build the tools each project actually needs."   # text below the headline
  values_title: "Our values"   # heading above the values row (empty = hidden)
  values:                   # row of three short values, one line each
    - "Measure what matters."
    - "Prefer custom solutions."
    - "Chase synergies, not compromise."
  people:                   # people cards; ids must match _data/platform.yml (people); bios may use "I"
    matteo:
      name: "Matteo Jucker Riva"
      role: "Data Scientist & Remote Sensing Specialist"
      bio: "Geography PhD. 10+ years of field sampling and satellite data across soil carbon, land management, and ecosystem monitoring."
      photo_alt: ""         # description of the photo for screen readers
      linkedin: "LinkedIn"  # link text; the URL is linkedin_url of this person in _data/platform.yml
    patrick:
      name: "Patrick Schirmer"   # empty = card not shown
      role: "Product & Platform Manager"
      bio: "Spatial data scientist with a PhD in agent-based simulation (ETH Zurich). Develops data strategies for organizations and leads the shared data platform udl.ai that powers TerraDataLab."
      photo_alt: ""         # description of the photo for screen readers
      linkedin: "LinkedIn"  # link text; the URL is linkedin_url of this person in _data/platform.yml

footer:                     # bottom of the page
  pages_label: "Pages"      # title of the column with the section links
  legal_label: "Legal"      # title of the column with the legal links (Imprint; Privacy while hidden: not shown)
  contact_label: "Contact"  # title of the column with e-mail and LinkedIn
  linkedin: "LinkedIn"      # LinkedIn link text (URL: linkedin_url in _data/platform.yml)
  privacy: ""               # Privacy link hidden until the text exists (page kept, unlinked)
  imprint: "Imprint"        # link to the imprint page
  copyright: "© 2026 TerraDataLab"   # copyright line under the logo

not_found:                  # 404 page
  title: "Page not found."   # headline
  text: "The page you are looking for does not exist or has moved."   # text below the headline
  back: "Back to the home page"   # link back to the home page
