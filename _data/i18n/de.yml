# TerraDataLab: ALL WEBSITE TEXT, German
#
# How to edit:
#   - Change only the text between the quotes. Do not rename the keys (the words before ":").
#   - Every language file (en.yml, de.yml, fr.yml, it.yml) has exactly the same keys.
#   - For a long text spanning several lines use:   text: |
#                                                     First line…
#     Leave an empty line between paragraphs.
#   - A list item starts with "- " on its own line.
#   - Section order follows the page from top to bottom.
#   - An empty text ("") is simply not shown on the page.

meta:
  title: ""                 # browser tab / search result title (empty: "TerraDataLab")
  description: ""           # search result snippet + share-preview text (same text as hero.subtitle)

nav:
  how_we_work: ""                    # header link to the How we work section
  solutions: ""                      # header link to the Solutions section
  about: ""                          # header link to the Who we are section
  cta: ""                            # header button (e-mail)
  language: ""              # screen-reader label for the language switcher
  skip: ""                  # "Skip to content" link for keyboard users

udl_banner:                 # blue UrbanDataLab banner, home page only: under the header and again above the footer (empty = hidden)
  text: ""                  # text of the banner
  link: ""                  # link to urbandatalab.ch (sister_url in _data/platform.yml); the arrow is added by the design
  tagline: ""               # shown after the link, desktop only (empty = hidden)

hero:                       # first block of the page
  eyebrow: ""               # small line above the headline (not used for now)
  title: ""                 # headline, first part
  title_accent: ""          # headline, second part: shown in green on its own line (empty = not shown)
  subtitle: ""              # text below the headline
  offer: ""                 # short highlighted line ("the offer")
  cta_primary: ""                           # main button: opens the booking page (new tab)
  cta_secondary: ""                         # second button: jumps to How we work
  image_alt: ""             # description of the hero image for screen readers (empty = decorative)

how_we_work:                # "How we work" section (header link "How we work")
                            # display order: title → intro → platform hub → button (cta) → steps (each: title, text, detail paragraph below)
  eyebrow: ""               # small line above the headline (not used for now)
  title: ""                 # main headline at the top of the section
  platform:                 # block "viewer at the centre + modules around it"
    title: ""               # centred headline of the block (not used for now; empty = hidden)
    intro: ""               # text below the block headline
    video_alt: ""           # description of the Core Data Viewer video for screen readers
    core:                   # caption under the video
      name: ""
      text: ""
    modules:                # items around the video; ids must match _data/platform.yml (modules)
      satellite:
        name: ""
        text: ""
      public_db:
        name: ""
        text: ""
      metrics:
        name: ""
        text: ""
      operations:
        name: ""
        text: ""
      dynamic_monitoring:
        name: ""
        text: ""
      weather_scenarios:
        name: ""
        text: ""
  steps:                    # numbered steps, 01–03 automatically; detail = paragraph below each step
    - title: ""
      text: ""
      detail: ""
    - title: ""
      text: ""
      detail: ""
    - title: ""
      text: ""
      detail: ""
  cta: ""                   # button below the steps (e-mail)

solutions:                  # "Solutions" section: cards, one per combination, each listing its modules by the names under "columns" (no table)
  eyebrow: ""               # small line above the headline (not used for now)
  title: ""                                   # headline
  intro: ""                                   # text below the headline
  modules_label: ""         # green label before the module names on each card
  columns:                  # module names listed on each card; ids must match _data/platform.yml (solution_columns)
    core: ""
    satellite: ""
    public_db: ""
    metrics: ""
    operations: ""
  items:                    # one card per combination (name + short text); ids must match _data/platform.yml (combinations)
    see_field:
      name: ""
      text: ""
    baseline:
      name: ""
      text: ""
    land_evolution:
      name: ""
      text: ""
    operations:
      name: ""
      text: ""
    audit:
      name: ""
      text: ""

cta:                        # green band near the bottom
  title: ""                                    # text in the band
  button: ""                # button: opens the booking page (new tab)

about:                      # "Who we are" section, after the green band
  title: ""                                  # headline
  intro: ""                 # text below the headline
  values_title: ""          # heading above the values row (empty = hidden)
  values:                   # row of three short values, one line each
    - ""
    - ""
    - ""
  people:                   # people cards; ids must match _data/platform.yml (people); bios may use "I"
    matteo:
      name: ""
      role: ""
      bio: ""
      photo_alt: ""         # description of the photo for screen readers
      linkedin: ""          # link text; the URL is linkedin_url of this person in _data/platform.yml
    patrick:
      name: ""              # empty = card not shown
      role: ""
      bio: ""
      photo_alt: ""         # description of the photo for screen readers
      linkedin: ""          # link text; the URL is linkedin_url of this person in _data/platform.yml

footer:                     # bottom of the page
  pages_label: ""           # title of the column with the section links
  legal_label: ""           # title of the column with the legal links (Imprint; Privacy while hidden: not shown)
  contact_label: ""         # title of the column with e-mail and LinkedIn
  linkedin: ""              # LinkedIn link text (URL: linkedin_url in _data/platform.yml)
  privacy: ""               # Privacy link hidden until the text exists (page kept, unlinked)
  imprint: ""               # link to the imprint page
  copyright: ""                      # copyright line under the logo

not_found:                  # 404 page
  title: ""                 # headline
  text: ""                  # text below the headline
  back: ""                  # link back to the home page
